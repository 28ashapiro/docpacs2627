<!-- ARTICLE -->

<article>

<h2>Contact Us</h2>

<form action="post">
    <label for="fname">First Name</label><br>
    <input type="text" name='fname' id="'fname" placeholder="Your name"><br>
    <label for="lname">Last Name</label><br>
    <input type="text" name="lname" id="lname" placeholder="Your last name"><br>
    <label for="company">Company</label><br>
    <input type="text" name="company" id="company" placeholder="Your company"><br>
    <label for="mail">Email Address</label><br>
    <input type="email" name="mail" id="mail" placeholder="Your email"><br>
    <label for="country">Country</label><br>
    <input type="text" name="country" id="country" placeholder="Your country"><br>
    <label for="comments">Addtional Comments</label><br>
    <textarea name="comments" id="comments" rows="4" placeholder= 'Additional Comments'></textarea><br><br>

    <label for="days">Days Available For Contact</label><br>
    <select name="days" id="days" size="7" multiple>
        <option value="mon">Monday</option>
        <option value="tues">Tuesday</option>
        <option value="weds">Wednesday</option>
        <option value="thurs">Thursday</option>
        <option value="fri">Friday</option>
        <option value="satur">Saturday</option>
        <option value="sun">Sunday</option>
    </select><br><br>

    <label for="time">When Are You Available?</label><br>
    <input type="checkbox" id="check1" name="time" value="morn"><label for="check1">Morning</label><br>
    <input type="checkbox" id="check2" name="time" value="even"><label for="check2">Evening</label><br>
    <input type="checkbox" id="check3" name="time" value="night"><label for="check3">Night</label><br><br>

    <label for="mailing">Would You Like To Be Added To Our Mailing List?</label><br>
    <input type="radio" id="check4" name="mailing" value="yes"><label for="check4">Yes</label><br>
    <input type="radio" id="check5" name="mailing" value="no"><label for="check5">No</label><br><br>

    <input type="submit" src="./contactus/submit.jpg">

</form>


</article>
