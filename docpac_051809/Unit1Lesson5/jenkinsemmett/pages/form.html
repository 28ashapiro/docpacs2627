<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: antiquewhite;
        }
    </style>
</head>
<body>
    <h1>Is Form, Not Bar</h1>
    <form action="/form" method="post">
        <p>A Form Created For Unit 1 Lesson 5.</p>
        <label for="name">Input Your Name:</label>
        <input type="text" id="name" name="name" required><br>

        <label for="mail">Input Your Email:</label>
        <input type="email" id="mail" name="mail" required><br>

        <label for="size">Input Your Team Size:</label>
        <input type="number" min="1" max="10" id="size" name="size" required><br>

        <p>Choose Your Project Type:</p>
        <input type="radio" id="choice1" name="projectChoice" value="website" />
        <label for="choice1">Website</label><br>
        <input type="radio" id="choice2" name="projectChoice" value="application" />
        <label for="choice2">Application</label><br>
        <input type="radio" id="choice3" name="projectChoice" value="game" />
        <label for="choice3">Game</label><br>

        <p>What Technologies Will Be Used:</p>
        <input type="checkbox" id="choice4" name="techChoice" value="htmlCSS" />
        <label for="choice4">HTML and CSS</label><br>
        <input type="checkbox" id="choice5" name="techChoice" value="javaScript" />
        <label for="choice5">JavaScript</label><br>
        <input type="checkbox" id="choice6" name="techChoice" value="nodeJS" />
        <label for="choice6">Node.js</label><br>
        <input type="checkbox" id="choice7" name="techChoice" value="database" />
        <label for="choice7">Databases</label><br><br>
        
        <select name="difficult" id="difficult-select" required>
            <option value="">--Choose a project difficulty--</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
        </select><br><br>

        <textarea id="description" name="description" rows="5" cols="33">--Place Description Here--</textarea><br>

        <input type="checkbox" id="choice8" name="contactChoice" value="yes" />
        <label for="choice8">Grant Permission To Contact You</label><br>

        <input type="hidden" id="hidden" name="formType" value="projectInterest"/>
        <input type="checkbox" id="choice8" name="contactChoice" disabled/>

        <br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset Form">
    </form>
</body>
</html>
