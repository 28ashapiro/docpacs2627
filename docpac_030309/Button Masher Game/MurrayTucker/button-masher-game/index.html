<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Masher Game</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./game.js" defer></script>
</head>
<body>
    <div class="strip">
        <div>
            <label for="scoreBox">Score: </label>
            <div id="scoreBox">0</div>
        </div>
        <div>
            <label for="timerBox">Time: </label>
            <div id="timerBox">20</div>
        </div>
    </div>
    <div id="directionContainer">
        <div id="directionBox">Left</div>
    </div>

    <div class="strip">
        <div id="controllerStatus">No controller detected</div>
        <div>You get 20s to get a high score. Hold left joystick in indicated direction and mash "A". Press "Start" to try again</div>
    </div>

    <div id="statusMessageContainer">
        <div id="statusMessage"></div>
    </div>
</body>
</html>
