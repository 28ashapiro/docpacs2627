<!DOCTYPE html>
<html>

<head>
    <title>Button Masher Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
</head>

<body>
    <h1>Button Masher Game</h1>
    <p id="instructions">
        Hold the left joystick in the direction shown and press A to score points.
        You have 20 seconds. Press Start to restart.
    </p>
    <div id="scoreBox">Score: 0</div>
    <div id="timerBox">Time: 20</div>
    <div id="directionBox">Up</div>
    <div id="controllerStatus">Controller not detected</div>

</body>

</html>
