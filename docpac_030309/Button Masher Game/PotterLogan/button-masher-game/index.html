<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Masher Game</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    
    <div id="scoreBox">
        <p>Score:</p>
        <p id="scoreHolder">0</p>
    </div>

    <div id="timerBox">
        <p>Time:</p>
        <p id="timeHolder">20</p>
    </div>

    
    <div id="directionBox">
        <p id="start1">Press START on your controller to start!</p>
        <p id="start2">Controls: Hold left joystick in the direction displayed and spam A for points!</p>
        <p>Direction:</p>
        <p id="directionHolder"></p>
    </div>

    
    <div id="controllerStatus">
        <p id="controllerStatusHolder"></p>
    </div>


</body>
    <script src="game.js"></script>
</html>
