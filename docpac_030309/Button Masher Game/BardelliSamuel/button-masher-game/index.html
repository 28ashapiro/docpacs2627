<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Masher Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p id="controllerStatus">Controller not detected</p>
    <div class="infos"><h1 class="infos">Button Masher</h1></div>
    <div class="infos"><h2 class="infos">Hold the displayed direction on the left stick and press a as many times as you can</h2></div>

    <div id="boxes">
        <div class="box" id="scoreBox">Score: 0</div>
        <div class="box" id="directionBox"></div>
        <div class="box" id="timerBox">Time: 20</div>
    </div>
    <script src="game.js"></script>
</body>

</html>
