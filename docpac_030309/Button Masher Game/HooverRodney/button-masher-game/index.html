<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Cool Button Masher</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
        <h1>Super Cool Button Masher!</h1>
        <p>When playing, tilt the left joystick to the displayed direction below, and press the 'A' button to increase the score!</p>
    <div id="timerBox" class="normaldiv">
        Time: 20
    </div>
    <div id="directionBox" class="normaldiv">

    </div>
    <div id="scoreBox" class="normaldiv">
        Score: 0
    </div>
    <div id="controllerStatus">
        Controller not detected
    </div>
    <div id="message">
        Press 'Start' on your controller to begin!
    </div>
    <script src="game.js"></script>
</body>

</html>
