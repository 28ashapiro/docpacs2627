<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 1 Lesson 4</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <fieldset>
        <legend>IP Grabber 3000</legend>
        <form method="POST" action="/form">
        
            <label for="message">Your IP Here</label>
            <input name="message" id="message" type="text" required>
            <button>Submit via POST</button>
            
        </form>
        <form method="GET" action="/query">
        
            <label for="message">Your Password Here</label>
            <input name="message" id="message" type="text" required>
            <button>Submit via GET</button>
            
        </form>
    </fieldset>
</body>
</html>
