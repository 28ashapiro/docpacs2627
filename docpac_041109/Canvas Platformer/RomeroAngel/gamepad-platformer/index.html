<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
    <title>canvas platformer</title>
</head>

<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="controllerStatus">Press Any Button To Begin!</div>
    <div id="debugInfo">
        <p>Player X: <span id="playerX">0</span></p>
        <p>Player Y: <span id="playerY">0</span></p>
        <p>Player VX: <span id="playerVX">0</span></p>
        <p>Player VY: <span id="playerVY">0</span></p>
        <p>Grounded: <span id="grounded">false</span></p>
        <p>Controller: <span id="controller">Not connected</span></p>
    </div>
</body>

</html>
