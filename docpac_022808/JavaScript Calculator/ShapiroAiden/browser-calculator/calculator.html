<!-- WEBERSITE -->
<body>
<h1>JS CALC!!!!</h1><div id="slang">SLANG FOR JAVASCRIPT CALCULATOR 😎😎</div><br>
<input type="number" id="num1" placeholder="1st number!">
<select id="operator">
    <option value="add">+</option>
    <option value="sub">-</option>
    <option value="mul">*</option>
    <option value="div">÷</option>
    <option value="mod">%</option>
    <option id="verity" value="verity" hidden>☺</option>
</select>
<input type="number" id="num2" placeholder="2nd number!" ><div id="hi1">─────</div><div id="result">Result!</div><div id="hi2">─────</div>
<!-- <input id="result" placeholder="Result!" disabled> -->
<button type="button" onclick="calculate()">CALCULATE!!!!!</button>

<!-- SCRIPTING -->
<script>
function calculate(){
    let num1 = document.getElementById("num1").value
    let num2 = document.getElementById("num2").value


    if (num1 == '' || num2 == ''){
        result = "Please enter two numbers!"
        document.getElementById("result").innerHTML = result
        return result
    }
    num1 = Number(num1)
    num2 = Number(num2)

    // let options = doucment.getElementById("operator");

    // options.addEventListener("click", (event) => {
    //     let veritychance = Math.round(Math.random()*10)
    //     console.log(veritychance);

    //     if (veritychance == 1) {
    //         document.getElementById("verity").hidden = false;
    //     } else {
    //         document.getElementById("verity").hidden = true;
    //     }
    // })

    operator = document.getElementById("operator").value
    if (operator == "add"){
        result = num1 + num2
        document.getElementById("result").innerHTML = result
    } else if (operator == "sub"){
        result = num1 - num2
        document.getElementById("result").innerHTML = result
    } else if (operator == "mul"){
        result = num1 * num2
        document.getElementById("result").innerHTML = result
    } else if (operator == "div"){
        result = num1 / num2
        if (num2 == 0){
            result = "Error!"
        }
        document.getElementById("result").innerHTML = result
    } else if (operator == "mod") {
        result = num1 % num2
        if (num2 == 0){
            result = "Error!"
        }
        document.getElementById("result").innerHTML = result
    } 
  
}
</script>
