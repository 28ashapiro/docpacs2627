<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Calculator</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <h1>Javascript Calculator</h1>
    <div id="divydivdiv">
        <label class="set1" for= "input1">Input One</label>
            
        <br>

        <input class="set1" type="number" id="input1">

        <br>
            
        <label class="set2" for="operation">Operation</label>
        
        <br>
        
        <select class="set2" id="operation">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">÷</option>
            <option value="%">%</option>
        </select> 
    
        <br>

        <label class="set3" for="input2">Input Two</label>

        <br>

        <input class="set3" id="input2" type="number">

        <br>

        <button id="calc" type="button" onclick="calculate()" >Calculate</button>
        <h2>Result</h2>
        <div id="result">
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
