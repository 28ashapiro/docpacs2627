<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <label for="firstNumber" id="firstnumberLabel">First Number:</label>
        <input type="number" name="Number" id="firstNumber" placeholder="First number here...">
        <label for="operation" id="dropdownLabel">Operation:</label>
        <select name="operation" id="operation">
            <option value="add">+</option>
            <option value="subtract">-</option>
            <option value="multiply">*</option>
            <option value="divide">/</option>
            <option value="percent">%</option>
        </select>
        <label for="secondNumber" id="secondnumberLabel">Second Number:</label>
        <input type="number" name="Second Number" id="secondNumber" placeholder="Second number here...">
        <label for="result" id="resultLabel">Result:</label>
        <div id="result"></div>
        <button type="button" id="calculateBtn" onclick="calculate()">Calculate</button>
    </div>

    <script src="calculator.js"></script>
</body>

</html>
