<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
    <title>Button Masher!</title>
</head>
<body>
    <h1>PRESS START TO BEGIN</h1>
    <h2>MASH A WHILE HOLDING LEFT JOYSTICK IN THE CORRECT DIRECTION!</h2>
    <label for="scoreBox">Score:</label>
    <div id="scoreBox">0</div>

    <label for="timerBox">Time:</label>
    <div id="timerBox">20</div>

    <div id="directionBox"></div>

    <div id="controllerStatus"></div>

    <label for="playerName">USERNAME:</label>
    <input id="input" name="playerName" maxlength="20" type="text">

    <div id="controllerStatus"><a href="index.html">BACK TO HOMEPAGE</a></div>

    <p id="submissionMessage"></p>

    <div id="highScore" style="display: none;">
        <a href="/highscores.html" class="button"><button>HIGH SCORES</button></a>
    </div>

</body>
</html>
